[workspace]
resolver = "2"
members = [
    "crates/sidebar",
    "crates/ai_core",
    "crates/app",
    "crates/command_palette",
    "crates/keybindings",
    "crates/preferences",
    "crates/terminal",
    "crates/themes",
    "crates/window",
    "crates/model_selection",
    "crates/boxxy_vte",
    "crates/boxxy_agent",
    "crates/boxxy_claw",
    "crates/boxxy_claw_protocol",
    "crates/boxxy_claw_ui",
    "crates/boxxy_claw_widget",
    "crates/db",
    "crates/boxxy_bookmarks",
    "crates/core_widgets",
    "crates/core_toolbox",
    "crates/viewer",
    "crates/telemetry",
    "crates/boxxy_mcp",
    "crates/scenario_runner",
    "crates/sys_utils",
    "crates/boxxy_assets",
    ]

[workspace.package]
version = "0.0.35"
edition = "2024"
rust-version = "1.98"
authors = ["Mii <miifrommera@gmail.com>"]
description = "Stupid Linux Terminal"
license = "MIT"

[workspace.lints.rust]
rust_2018_idioms = "deny"
unused_must_use = "deny"
unreachable_pub = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
pedantic = "warn"
type_complexity = "warn"
nursery = "warn"

[workspace.dependencies]
anyhow = "1.0.104"
async-trait = "0.1"
boxxy-model-selection = { path = "crates/model_selection" }
boxxy-keybindings = { path = "crates/keybindings" }
boxxy-terminal = { path = "crates/terminal" }
boxxy-themes = { path = "crates/themes" }
boxxy-window = { path = "crates/window" }
boxxy-core-widgets = { path = "crates/core_widgets" }
directories = "6.0.0"
cairo-rs = "0.22"
gdk-pixbuf = "0.22"
gio = { version = "0.22", features = ["v2_76"] }
glib = "0.22"
pango = "0.22"
glib-build-tools = "0.22"
gtk4 = { version = "0.11", features = ["v4_22"] }
libadwaita = { version = "0.9", features = ["v1_9"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sourceview5 = "0.11"
chrono = { version = "0.4", features = ["serde"] }
async-channel = "2.5.0"
tokio = { version = "1.54.1", features = ["full"] }
futures-channel = "0.3.34"
futures-util = "0.3.34"
log = { version = "0.4.34", features = ["std", "serde", "release_max_level_info"] }
env_logger = "0.11.11"
rig = { version = "0.45.0", default-features = true }
rig-memory = "0.45.0"
nix = { version = "0.31.3", features = ["process", "term", "fs", "signal", "ioctl", "user"] }
zbus = { version = "6.1.0", features = ["tokio", "p2p"] }
libc = "0.2"
ashpd = { version = "0.13.13", features = ["flatpak", "open_uri"] }
gstreamer = "0.25.4"
image = { version = "0.25", features = ["jpeg", "png", "webp"] }
gsk4 = "0.11"
regex = "1.13.1"
parking_lot = "0.13.0"
base64 = "0.23.1"
bitflags = "2.13.2"
home = "0.5.12"
regex-automata = "0.4.18"
unicode-width = "0.2.3"
arc-swap = "1.9.3"
cursor-icon = "1.2"
memchr = "2.8"
miniz_oxide = "0.9.1"
rustix-openpty = "0.2.0"
rustix = "1.1.6"
signal-hook = "0.4.5"
self_update = { version = "1.3.3", default-features = false, features = ["archive-tar", "compression-tar-gz", "reqwest", "rustls", "github", "checksums", "async"] }
tempfile = "3.27.0"
tar = "0.4.46"
flate2 = "1.1.10"
sha2 = "0.11"
sqlx = { version = "0.9.0", features = ["sqlite", "runtime-tokio", "macros", "chrono"] }
serde_yml = "0.0.13"
thiserror = "2.0"
notify = "8.2.1"
notify-debouncer-mini = "0.7.0"
uuid = { version = "1.29.0", features = ["v4"] }
getrandom = "0.4.3"
rand = "0.10.3"
toml = "1.1.8"
boxxy-bookmarks = { path = "crates/boxxy_bookmarks" }
sysinfo = { version = "0.40.0", default-features = false, features = ["system", "disk", "component", "gpu"] }
arboard = "3.7.0"
pulldown-cmark = "0.13.5"
syntect = "5.3.0"
similar = { version = "3.2.1", features = ["inline", "unicode"] }
boxxy-viewer = { path = "crates/viewer" }
boxxy-telemetry = { path = "crates/telemetry" }
boxxy-sys-utils = { path = "crates/sys_utils" }
boxxy-mcp = { path = "crates/boxxy_mcp" }
rmcp = { version = "3.8.0", default-features = false, features = ["client", "transport-streamable-http-client-reqwest", "transport-child-process", "transport-async-rw", "which-command"] }
opentelemetry = "0.33.1"
opentelemetry_sdk = { version = "0.33.1", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.33.1", features = ["http-json", "reqwest-rustls"] }
opentelemetry-http = "0.33.1"
opentelemetry-stdout = { version = "0.33.1", features = ["metrics"] }
serial_test = "4.0.1"
