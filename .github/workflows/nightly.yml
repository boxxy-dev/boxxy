name: Nightly Build

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build:
    name: Build (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get short SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Build in Fedora Container
        uses: addnab/docker-run-action@v3
        with:
          image: fedora:rawhide
          options: --platform linux/${{ matrix.arch }} -v ${{ github.workspace }}:/workspace -e GIT_HASH=${{ env.sha_short }}
          run: |
            set -euo pipefail

            dnf install -y \
              gcc pkgconfig binutils \
              gtk4-devel libadwaita-devel \
              gtksourceview5-devel \
              gstreamer1-devel gstreamer1-plugins-base-devel gdk-pixbuf2-devel \
              glib2-devel sqlite-devel \
              tar gzip git curl

            # Install Rust
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
            source "$HOME/.cargo/env"

            cd /workspace

            # Verify Cargo dependency tree has no native OpenSSL/TLS dependencies
            if cargo tree --locked | grep -Eq '(^| )openssl(-sys)? v|(^| )native-tls v'; then
              echo "ERROR: Native OpenSSL/TLS dependency detected in Cargo tree:"
              cargo tree --locked | grep -E 'openssl(-sys)?|native-tls'
              exit 1
            fi

            # CI must use the dependency graph committed in Cargo.lock
            cargo build --release --locked

            # Verify binaries exist first
            for binary in boxxy-terminal boxxy-agent; do
              if [ ! -x "target/release/$binary" ]; then
                echo "Error: target/release/$binary not found"
                exit 1
              fi
            done

            # Check ONLY direct ELF dependencies (DT_NEEDED).
            # Do not use ldd here, as ldd recursively inspects Fedora's system libraries.
            for binary in boxxy-terminal boxxy-agent; do
              echo "Direct dependencies for $binary:"
              readelf -d "target/release/$binary" | grep NEEDED || true

              if readelf -d "target/release/$binary" \
                | grep NEEDED \
                | grep -Eq 'libssl\.so|libcrypto\.so'; then
                echo "ERROR: $binary directly links against OpenSSL:"
                readelf -d "target/release/$binary" \
                  | grep NEEDED \
                  | grep -E 'libssl\.so|libcrypto\.so'
                exit 1
              fi
            done

            echo "OK: Boxxy binaries have no direct OpenSSL dependency."

            PKG_NAME="boxxy-terminal-nightly-linux-${{ matrix.arch }}"
            mkdir -p "${PKG_NAME}/bin"
            mkdir -p "${PKG_NAME}/share/applications"
            mkdir -p "${PKG_NAME}/share/icons/hicolor/scalable/apps"

            cp target/release/boxxy-terminal "${PKG_NAME}/bin/"
            cp target/release/boxxy-agent "${PKG_NAME}/bin/"
            cp flatpak/dev.boxxy.BoxxyTerminal.desktop "${PKG_NAME}/share/applications/"
            cp resources/icons/dev.boxxy.BoxxyTerminal.png "${PKG_NAME}/share/icons/hicolor/scalable/apps/"

            tar -czvf "${PKG_NAME}.tar.gz" "${PKG_NAME}"
            sha256sum "${PKG_NAME}.tar.gz" | awk '{print $1}' > "${PKG_NAME}.tar.gz.sha256"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.arch }}
          path: |
            boxxy-terminal-nightly-linux-${{ matrix.arch }}.tar.gz
            boxxy-terminal-nightly-linux-${{ matrix.arch }}.tar.gz.sha256

  publish:
    name: Publish Nightly
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          merge-multiple: true

      - name: Update Nightly Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Atomic update: Delete old release and recreate with ALL assets at once
          gh release delete nightly --yes || true
          git tag -d nightly || true
          git push origin :refs/tags/nightly || true

          # Ensure nightly tag exists on the current commit
          git tag nightly
          git push origin nightly

          # Use wildcards to include all downloaded tarballs and checksums
          gh release create nightly *.tar.gz *.tar.gz.sha256 \
            --title "Nightly Build ($(date -u '+%Y-%m-%d'))" \
            --notes "This release contains the latest automated builds from the main branch."

          # Force GitHub to update the 'published_at' timestamp to now so it stays at the top of the releases page
          RELEASE_ID=$(gh release view nightly --json databaseId -q .databaseId)
          gh api --method PATCH /repos/${{ github.repository }}/releases/$RELEASE_ID -F draft=true
          gh api --method PATCH /repos/${{ github.repository }}/releases/$RELEASE_ID -F draft=false

      - name: Trigger Flatpak sync
        env:
          GITHUB_TOKEN: ${{ secrets.FLATPAK_REMOTE_TOKEN }}
        run: |
          COMMIT_SHA=$(git rev-parse HEAD)
          gh api repos/boxxy-dev/boxxy-flatpak-remote/dispatches \
            --method POST \
            -f event_type=nightly-built \
            -f "client_payload[commit]=$COMMIT_SHA"
