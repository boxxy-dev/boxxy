[package]
name = "boxxy-vte"
version = "0.1.0"
edition = "2024"
description = "A pure-Rust, lock-free, async-first ANSI terminal emulator widget for GTK4"
license = "Apache-2.0"

[features]
default = ["serde"]
serde = ["dep:serde", "bitflags/serde"]

[dependencies]
gtk4 = { workspace = true }
glib = { workspace = true }
log = { workspace = true }
regex = { workspace = true }
libc = { workspace = true }
async-channel = { workspace = true }

# vte dependencies
base64 = { workspace = true }
bitflags = "2.13.2"
regex-automata = { workspace = true, features = ["unicode-word-boundary"] }
unicode-width = { workspace = true }
serde = { workspace = true, features = ["rc"], optional = true }
tokio = { workspace = true }
arc-swap = { workspace = true }
cursor-icon = { workspace = true }
memchr = { workspace = true }
image = { workspace = true }
miniz_oxide = { workspace = true }

[dev-dependencies]
env_logger = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(unix)'.dependencies]
rustix-openpty = { workspace = true }
rustix = { workspace = true, features = ["std"] }
signal-hook = { workspace = true }
